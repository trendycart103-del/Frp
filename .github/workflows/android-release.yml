name: Android Release Build

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag / app version name"
        required: true
        default: v1.0.0
        type: string
      frp_version:
        description: "Optional: override upstream frp version (leave empty to use frplib/go.mod)"
        required: false
        default: ""
        type: string
      publish_release:
        description: "Publish the APKs as a GitHub Release"
        required: true
        default: false
        type: boolean
  push:
    paths:
      - "*.zip"

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release:
    name: Extract ZIP, build frplib, sign and package APKs
    runs-on: ubuntu-latest
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
        working-directory: project
    env:
      APP_VERSION_NAME: ${{ inputs.tag || 'v1.0.0' }}
      NDK_VERSION: "29.0.14206865"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Prepare project directory (extract ZIP if present)
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          rm -rf project _extract
          mkdir -p project _extract

          zip_file="$(find . -maxdepth 2 -type f -iname '*.zip' -not -path './.git/*' -not -path './project/*' -not -path './_extract/*' | head -n 1)"

          if [ -n "${zip_file}" ]; then
            echo "Found ZIP: ${zip_file}"
            unzip -q -o "${zip_file}" -d _extract
            settings="$(find _extract -maxdepth 4 -type f -name 'settings.gradle.kts' | awk '{ print length($0) " " $0 }' | sort -n | head -n 1 | cut -d' ' -f2-)"
            [ -n "${settings}" ] || { echo "::error::settings.gradle.kts not found inside ${zip_file}"; exit 1; }
            src_dir="$(dirname "${settings}")"
          else
            echo "No ZIP found, using repository contents."
            settings="$(find . -maxdepth 3 -type f -name 'settings.gradle.kts' -not -path './project/*' -not -path './_extract/*' | awk '{ print length($0) " " $0 }' | sort -n | head -n 1 | cut -d' ' -f2-)"
            [ -n "${settings}" ] || { echo "::error::settings.gradle.kts not found in repository"; exit 1; }
            src_dir="$(dirname "${settings}")"
          fi

          echo "Project root: ${src_dir}"
          cp -a "${src_dir}/." project/
          rm -rf _extract

          for required in app frplib ci gradle settings.gradle.kts build.gradle.kts; do
            [ -e "project/${required}" ] || { echo "::error::Missing required item: ${required}"; exit 1; }
          done

          find project/ci -type f -name '*.sh' -exec sed -i 's/\r$//' {} +
          chmod +x project/ci/*.sh
          ls -la project

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: project/frplib/go.mod
          cache-dependency-path: project/frplib/go.sum

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-37.0 build-tools;37.0.0 platform-tools"

      - name: Install Android NDK
        run: |
          set -euo pipefail
          sdkmanager --channel=0 --install "ndk;${NDK_VERSION}"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "${GITHUB_ENV}"

      - name: Install gomobile
        run: |
          set -euo pipefail
          go install golang.org/x/mobile/cmd/gomobile@latest
          gomobile init

      - name: Build frplib universal AAR
        env:
          FRP_VERSION: ${{ inputs.frp_version }}
        run: bash ci/build-frplib.sh

      - name: Validate frplib universal AAR
        run: bash ci/validate-frplib.sh

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 9.4.1
          build-root-directory: project

      - name: Prepare PKCS#12 release keystore
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          keystore="${RUNNER_TEMP}/release.p12"

          if [ -n "${SIGNING_KEY_BASE64}" ] && [ -n "${KEY_STORE_PASSWORD}" ] \
             && [ -n "${KEY_ALIAS}" ] && [ -n "${KEY_PASSWORD}" ]; then
            echo "Using signing key from repository secrets."
            echo "${SIGNING_KEY_BASE64}" | base64 --decode > "${keystore}"
            store_pass="${KEY_STORE_PASSWORD}"
            alias_name="${KEY_ALIAS}"
            key_pass="${KEY_PASSWORD}"
          else
            echo "::warning::Signing secrets not found. Generating a temporary keystore (updates over an older install will not work)."
            store_pass="ci-temp-pass-123456"
            alias_name="ci-temp"
            key_pass="${store_pass}"
            keytool -genkeypair \
              -storetype PKCS12 \
              -keystore "${keystore}" \
              -storepass "${store_pass}" \
              -keypass "${key_pass}" \
              -alias "${alias_name}" \
              -keyalg RSA \
              -keysize 4096 \
              -validity 10000 \
              -dname "CN=FRP Android CI, OU=CI, O=CI, L=NA, ST=NA, C=US"
          fi

          {
            echo "SIGNING_KEY_FILE=${keystore}"
            echo "KEY_STORE_PASSWORD=${store_pass}"
            echo "KEY_ALIAS=${alias_name}"
            echo "KEY_PASSWORD=${key_pass}"
          } >> "${GITHUB_ENV}"

      - name: Run unit tests
        continue-on-error: true
        run: gradle test --stacktrace

      - name: Build signed release APKs (universal, arm64-v8a, armeabi-v7a, x86_64)
        run: gradle :app:assembleRelease --stacktrace

      - name: Collect and rename APKs
        run: bash ci/collect-apks.sh

      - name: List APK files
        run: ls -lh artifacts/release/

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v7
        with:
          name: frp-android-release
          path: project/artifacts/release/*.apk
          if-no-files-found: error

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-reports
          path: |
            project/**/build/reports/tests/
            project/**/build/test-results/
          if-no-files-found: ignore

      - name: Publish GitHub Release
        if: ${{ inputs.publish_release }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.tag }}
          generate_release_notes: true
          files: project/artifacts/release/*.apk
