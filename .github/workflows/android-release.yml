name: Android Release Build

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag / app version name"
        required: true
        default: v0.0.1
        type: string
      frp_version:
        description: "Optional: override upstream frp version (leave empty to use frplib/go.mod)"
        required: false
        default: ""
        type: string
      publish_release:
        description: "Publish the APKs as a GitHub Release"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    name: Build frplib, test, sign and package APKs
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      APP_VERSION_NAME: ${{ inputs.tag }}
      NDK_VERSION: "29.0.14206865"

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: frplib/go.mod
          cache-dependency-path: frplib/go.sum

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-37.0 build-tools;37.0.0 platform-tools"

      - name: Install Android NDK
        run: |
          set -euo pipefail
          sdkmanager --channel=0 --install "ndk;${NDK_VERSION}"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "${GITHUB_ENV}"

      - name: Install gomobile
        run: |
          set -euo pipefail
          go install golang.org/x/mobile/cmd/gomobile@latest
          gomobile init

      - name: Build frplib universal AAR
        env:
          FRP_VERSION: ${{ inputs.frp_version }}
        run: bash ci/build-frplib.sh

      - name: Validate frplib universal AAR
        run: bash ci/validate-frplib.sh

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 9.4.1

      - name: Prepare PKCS#12 release keystore
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          keystore="${RUNNER_TEMP}/release.p12"

          if [ -n "${SIGNING_KEY_BASE64}" ] && [ -n "${KEY_STORE_PASSWORD}" ] \
             && [ -n "${KEY_ALIAS}" ] && [ -n "${KEY_PASSWORD}" ]; then
            echo "Using signing key from repository secrets."
            echo "${SIGNING_KEY_BASE64}" | base64 --decode > "${keystore}"
            store_pass="${KEY_STORE_PASSWORD}"
            alias_name="${KEY_ALIAS}"
            key_pass="${KEY_PASSWORD}"
          else
            echo "::warning::Signing secrets not found. Generating a temporary keystore. APKs will install, but the signature differs on every build, so updates over a previous install will fail."
            store_pass="ci-temp-pass-123456"
            alias_name="ci-temp"
            key_pass="${store_pass}"
            keytool -genkeypair \
              -storetype PKCS12 \
              -keystore "${keystore}" \
              -storepass "${store_pass}" \
              -keypass "${key_pass}" \
              -alias "${alias_name}" \
              -keyalg RSA \
              -keysize 4096 \
              -validity 10000 \
              -dname "CN=FRP Android CI, OU=CI, O=CI, L=NA, ST=NA, C=US"
          fi

          {
            echo "SIGNING_KEY_FILE=${keystore}"
            echo "KEY_STORE_PASSWORD=${store_pass}"
            echo "KEY_ALIAS=${alias_name}"
            echo "KEY_PASSWORD=${key_pass}"
          } >> "${GITHUB_ENV}"

      - name: Run unit tests
        continue-on-error: true
        run: gradle test --stacktrace

      - name: Build signed release APKs (universal, arm64-v8a, armeabi-v7a, x86_64)
        run: gradle :app:assembleRelease --stacktrace

      - name: Collect and rename APKs
        run: bash ci/collect-apks.sh

      - name: Show APK files
        run: ls -lh artifacts/release/

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v7
        with:
          name: frp-android-release
          path: artifacts/release/*.apk
          if-no-files-found: error

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
          if-no-files-found: ignore

      - name: Publish GitHub Release
        if: ${{ inputs.publish_release }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.tag }}
          generate_release_notes: true
          files: artifacts/release/*.apk
