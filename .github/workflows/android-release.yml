name: Build APK from ZIP

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          ZIP=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "ERROR: repository root-এ কোনো .zip ফাইল পাওয়া যায়নি"
            exit 1
          fi
          echo "Using ZIP: $ZIP"
          mkdir -p extracted
          unzip -o "$ZIP" -d extracted
          find extracted -maxdepth 3 -name settings.gradle.kts

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: |
          PROJECT_DIR=$(dirname "$(find extracted -name settings.gradle.kts | head -n 1)")
          echo "Project dir: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: USB-Checker-FRP-debug-apk
          path: extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
